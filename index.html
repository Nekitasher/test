<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let playerName = tg.initDataUnsafe?.user?.first_name || "Неизвестный";
    document.getElementById('user-info').innerText = "Игрок: " + playerName;

    // Получаем ID комнаты из URL (например: ?room=1234abcd)
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    // Подключаемся к нашему FastAPI серверу
    // wss:// используется для защищенного соединения (обязательно для Telegram)
    const ws = new WebSocket(`wss://your-domain.com/ws/${roomId}`);

    ws.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.type === "update") {
            console.log("Обновление стола:", data.message);
            // Здесь код обновления UI (смена карт, изменение банка и т.д.)
        }
    };

    function makeAction(actionType) {
        // Отправляем действие на сервер, а не локально
        const action = {
            player: playerName,
            action: actionType
        };
        ws.send(JSON.stringify(action));
    }
</script>
